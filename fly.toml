# Fly.io config — deploy straight from this folder, no Git repo needed.
#   flyctl launch --no-deploy --copy-config --name <your-app-name>
#   flyctl volumes create careflow_data --size 1
#   flyctl deploy
#
# The mount keeps data/db.json alive across restarts and deploys.

app = "careflow-ai"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

[[mounts]]
  source = "careflow_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
